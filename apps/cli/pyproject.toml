[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gpudeck-cli"
version = "1.0.0"
description = "GPU Deck command line (gpudeck): admin API client for the GPU control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Suresh Konakanchi" }]
dependencies = [
  # Command framework (click 8.x pinned through typer)
  "typer==0.21.1",
  # HTTP (respx mocks it in tests)
  "httpx==0.28.1",
  # Output; YAML request bodies and the bundled OpenAPI spec
  "rich==15.0.0",
  "pyyaml==6.0.3",
  # Request bodies are validated against the spec's JSON schema before sending
  "jsonschema==4.26.0",
  # Session storage (OS keychain; falls back to a 0600 file)
  "keyring==25.7.0",
  # Config file writing (reading uses stdlib tomllib)
  "tomli-w==1.2.0",
]

[project.urls]
Homepage = "https://sur950.github.io/gpu-deck/"
Repository = "https://github.com/sur950/gpu-deck"
Issues = "https://github.com/sur950/gpu-deck/issues"

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "black==26.3.0",
  "isort==7.0.0",
  "flake8==7.3.0",
  "mypy==1.20.0",
  "types-PyYAML==6.0.12.20250915",
  "types-jsonschema==4.26.0.20261006",
]

[project.scripts]
gpudeck = "gpudeck.main:run"

[tool.hatch.build.targets.wheel]
packages = ["gpudeck"]

# hatch_build.py copies libs/contracts/openapi/admin.yaml into the wheel and sdist as
# gpudeck/_spec/admin.yaml (the offline fallback spec). The copy is never committed.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
