# GoReleaser config for terraform-provider-gpudeck (run by .github/workflows/release.yml).
# Produces what the Terraform Registry expects: one zip per platform, a SHA256SUMS file that also
# covers the registry manifest, and a detached GPG signature of the SHA256SUMS file. The release
# workflow attaches them to the GitHub release; GoReleaser itself publishes nothing.
#
#   goreleaser release --clean --skip=publish,announce,validate            # signed (GPG_FINGERPRINT)
#   goreleaser release --clean --skip=publish,announce,validate,sign       # unsigned
version: 2
project_name: terraform-provider-gpudeck

before:
  hooks:
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - ${signature}
      - --detach-sign
      - ${artifact}

release:
  disable: true

changelog:
  disable: true
