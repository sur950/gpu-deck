[package]
name = "gpudeck-engines"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "GPU Deck node agent: engine adapters (llama.cpp, MLX, mlx-audio, vLLM, vLLM-Omni, SGLang, TensorRT-LLM, whisper.cpp, stable-diffusion.cpp, custom): command building, health, metric scraping."
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
gpudeck-devices = { path = "../gpudeck-devices" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-root-certs = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "sync", "io-util", "fs"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net"] }
