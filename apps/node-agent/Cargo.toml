# GPU Deck node agent — Rust workspace.
#
# The agent consumes gpudeck-devices / gpudeck-engines through its `plugins` feature
# (crates/gpudeck-agent/src/backend/plugins.rs).
[workspace]
resolver = "2"
members = ["crates/gpudeck-protocol", "crates/gpudeck-agent", "crates/gpudeck-devices", "crates/gpudeck-engines"]
default-members = ["crates/gpudeck-protocol", "crates/gpudeck-agent"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Suresh Konakanchi"]
repository = "https://github.com/sur950/gpu-deck"
homepage = "https://sur950.github.io/gpu-deck/"

[workspace.dependencies]
gpudeck-protocol = { path = "crates/gpudeck-protocol" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
ipnet = "2"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2", "server"] }
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.40"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
urlencoding = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
x509-parser = "0.16"
jsonschema = "0.26"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
