# GPU Deck node agent on Kubernetes GPU nodes. Non-interactive join: the agent joins on first
# start with GPUDECK_AGENT_JOIN_TOKEN (Secret) and keeps its identity on the host path, so a pod
# restart reuses the certificate. hostNetwork exposes the :9443 mTLS proxy on the node IP (direct
# serving mode; the agent accepts only the API layer's pinned key from private source ranges).
apiVersion: v1
kind: Namespace
metadata:
  name: gpudeck
---
apiVersion: v1
kind: Secret
metadata:
  name: gpudeck-agent-join
  namespace: gpudeck
type: Opaque
stringData:
  # Multi-use enrolment token, one for the whole DaemonSet:
  #   gpudeck nodes join-tokens create --cluster-id <id> --max-uses 100 --ttl-minutes 43200
  token: "gdj_CHANGE-ME"
  ca_fingerprint: "CHANGE-ME"      # sha256 of the hub CA (GET /agent/v1/ca)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpudeck-agent
  namespace: gpudeck
data:
  agent.toml: |
    hub_url = "https://gpudeck-hub.example.internal:8443"
    state_dir = "/var/lib/gpudeck"
    proxy_port = 9443
    egress_lock = "none"
    # In-cluster: the API layer reaches the node over the cluster network (agent protocol §13;
    # only its pinned key and private source ranges are accepted). Outside a cluster the
    # default is serving_mode = "tunnel" (no listener at all).
    serving_mode = "direct"
    firewall = "off"
    [labels]
    runtime = "kubernetes"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpudeck-agent
  namespace: gpudeck
  labels: {app.kubernetes.io/name: gpudeck-agent}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: gpudeck-agent}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gpudeck-agent}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        gpudeck.sur950.github.io/gpu: "true"
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [44, 109]   # video, render (match the host's GIDs)
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ghcr.io/sur950/gpu-deck-agent:1.0.0
          args: ["--config", "/etc/gpudeck/agent.toml", "--log-json", "run"]
          env:
            - name: GPUDECK_AGENT_JOIN_TOKEN
              valueFrom: {secretKeyRef: {name: gpudeck-agent-join, key: token}}
            - name: GPUDECK_AGENT_CA_FINGERPRINT
              valueFrom: {secretKeyRef: {name: gpudeck-agent-join, key: ca_fingerprint}}
            - name: GPUDECK_AGENT_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          ports:
            - {name: proxy, containerPort: 9443, hostPort: 9443, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 1Gi}
          livenessProbe:
            tcpSocket: {port: 9443}
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/gpudeck, readOnly: true}
            - {name: state, mountPath: /var/lib/gpudeck}
            - {name: tmp, mountPath: /tmp}
            - {name: dev-dri, mountPath: /dev/dri}
      volumes:
        - name: config
          configMap: {name: gpudeck-agent}
        - name: state
          hostPath: {path: /var/lib/gpudeck, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}
        - name: dev-dri
          hostPath: {path: /dev/dri, type: DirectoryOrCreate}
      # NVIDIA: run with the NVIDIA container runtime (runtimeClassName: nvidia) so NVML and
      # /dev/nvidia* are injected; AMD: add hostPath /dev/kfd.
      runtimeClassName: nvidia
