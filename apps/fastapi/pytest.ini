[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (real local Postgres + Redis from .env)
    e2e: End-to-end journeys (real login, real engines)
    slow: Slow running tests
    auth: Authentication related tests
    db: Database related tests
    api: API endpoint tests
    middleware: Middleware tests
    repository: Repository tests
    service: Service tests
asyncio_mode = auto
# One event loop for the whole session (pytest-asyncio>=1.0 no longer honours
# an overridden event_loop fixture). Session-scoped async fixtures and the
# app's global DB engine pool must share it, or asyncpg raises "attached to a
# different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*
