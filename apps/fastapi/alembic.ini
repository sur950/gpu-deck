[alembic]
# Path to migration scripts
script_location = app/db/postgres/alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of characters for message field in the revision table
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
sourceless = false

# Version location specification — one entry per migration folder.
# create_migration.sh rewrites this line; tests/unit/test_alembic_migrations.py checks it.
version_locations = app/db/postgres/alembic/migrations/001_init app/db/postgres/alembic/migrations/400_layout_unlisted_policy app/db/postgres/alembic/migrations/600_llamacpp_router_seed app/db/postgres/alembic/migrations/601_gpu_instances app/db/postgres/alembic/migrations/650_cloud_instances app/db/postgres/alembic/migrations/002_partition_fns_schema_aware app/db/postgres/alembic/migrations/200_join_token_multi_use app/db/postgres/alembic/migrations/003_llamacpp_pipeline_parallel app/db/postgres/alembic/migrations/300_external_deployments app/db/postgres/alembic/migrations/201_agent_updates app/db/postgres/alembic/migrations/202_node_latency

# The output encoding used when revision files are written
output_encoding = utf-8

# Database URL is set programmatically in env.py from app.core.settings

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
