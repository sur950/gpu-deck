# GPU Deck Admin API — OpenAPI 3.1. Generated once from the contract author's builder; edit this file directly from now on.
openapi: 3.1.0
info:
  title: GPU Deck Admin API
  version: 1.0.0
  summary: Control-plane REST API behind the web UI, CLI and Terraform provider.
  description: |-
    All paths are relative to `/api/v1` on the admin API (default `http://localhost:8180`).

    **Envelope.** Every JSON response is `{success, data, error, meta}`. List endpoints return `data: [...]` with `meta: {total, page, page_size, has_more}`; errors return `success: false` with `error: {code, message, details, field}` and the HTTP status. Streaming/CSV endpoints return raw bodies.

    **Auth.** Single admin. `POST /auth/login` sets an HttpOnly session cookie (`gpudeck_session`); API clients (CLI, Terraform) may instead send the same opaque token as `Authorization: Bearer`. Mutating requests made with the cookie must carry `X-CSRF-Token` (double submit, value from `GET /auth/csrf` / cookie `gpudeck_csrf`). Public endpoints: login, health, branding, PKI CA/CRL.

    **Async operations** (drain, scale, apply layout, prefetch, benchmarks) return `202` with ids to poll (`/swaps/{id}`, `/nodes/{id}/commands`, `/benchmark-runs/{id}`) or watch on `/live/events`.

    **Conventions.** Timestamps are RFC 3339 UTC. Ids are UUIDs. Byte sizes are integers in bytes. Percentages are 0-100. Filtering query params are ANDed; repeatable params are ORed. `sort` takes `field` or `-field`.

    **IP rules.** Requests from IPs blocked for scope `admin` get `403 IP_BLOCKED` before auth.

    Generated artifacts: TypeScript types for `apps/web` (openapi-typescript), the runtime command tree of `apps/cli` (built from this spec, no generated client), Go client for `apps/terraform-provider` (see docs/components/contracts.md).
