          type: integer
          minimum: 1
          maximum: 525600
          default: 15
          description: Lifetime in minutes; at most 1440 for a one-time token, up to a year
            for a multi-use enrolment token
        max_uses:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
          description: Machines the token may enrol. Use > 1 for Kubernetes DaemonSets and
            node pools; node_name_hint then must be empty (each machine uses its hostname)
