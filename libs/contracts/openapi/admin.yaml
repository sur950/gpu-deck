components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gpudeck_session
      description: Opaque Fernet session token (HttpOnly). Mutations also need X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: Same session token as a Bearer header (CLI/Terraform). No CSRF needed.
  parameters:
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Items per page (max 500)
    search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive substring/trigram search on name
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort field; prefix with - for descending (e.g. -created_at). Default -created_at.
    from:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Range start (inclusive, RFC 3339). Default now-1h
    to:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Range end (exclusive). Default now
    step:
      name: step
      in: query
      required: false
      schema:
        type: string
        default: 1m
      description: 'Bucket size: 2s (raw, only within METRICS_RAW_RETENTION_HOURS), 1m, 5m, 15m, 1h, 1d'
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Double-submit CSRF token from GET /auth/csrf (also set as the readable cookie gpudeck_csrf). Required on every mutating request made with the session cookie; not required when authenticating
        with a Bearer session token.
  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: Not authenticated / session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: Forbidden (CSRF failed, IP blocked)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: Conflict (duplicate name, state conflict such as swap in progress, or EXTERNAL_DEPLOYMENT when the target is an external deployment or instance GPU Deck only observes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error422:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error503:
      description: Dependency unavailable (DB/Redis) — Retry-After header set
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error502:
      description: Upstream (HF/ModelScope/agent) error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    api_key_status:
      type: string
      enum:
      - active
      - expired
      - revoked
      - suspended
    credential_type:
      type: string
      enum:
      - api_key
      - token
      - oauth
      - service_account
      - ssh_key
      - cloud_account
      - smtp
      - webhook
      - tls_key
      - ca_key
      - other
    credential_status:
      type: string
