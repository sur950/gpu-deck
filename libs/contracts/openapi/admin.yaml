- name: IP Rules
  description: Allow/block lists for the admin UI/API and the serving API layer
- name: Vault
  description: Encrypted secrets (cloud keys, HF/ModelScope tokens, SMTP/Slack/webhook secrets)
- name: Price Plans
  description: USD prices per GPU minute / per 1k tokens, attached to clusters or nodes
- name: Clusters
  description: 'Groups of GPU machines: bare metal, VMs, Kubernetes, cloud'
- name: Nodes
  description: 'GPU machines running the node agent: join, drain, remove, certificates'
- name: Devices
  description: Accelerator inventory and slices
- name: Topology
  description: Live cluster → node → device → instance graph
- name: Catalog
  description: 'Model catalog: Hugging Face, ModelScope, local paths; versions and files'
- name: Engines
  description: Engine registry, versions, compatibility checks, auto-pick
- name: Deployments
  description: Desired state of a served model; scaling, restart, traffic weights
- name: Instances
  description: Running replicas
- name: Model Cache
  description: 'Warm model files on node disks: prefetch, evict, pin'
- name: Layouts
  description: Named GPU layouts (Day/Night) applied manually or by time-schedule rules
- name: Rules
  description: Six rule types built in the UI, with dry run and history
- name: Swaps
  description: 'Swap manager operations: drain → unload → load → health, with rollback'
- name: Alerts
  description: Slack / email / webhook channels and alert events
- name: Metrics
  description: Time-series queries over GPU, inference and session metrics (names in libs/contracts/metrics.md)
- name: Logs
  description: Engine, agent, rule, swap and control-plane logs
- name: Traces
  description: Request traces (OpenTelemetry index)
- name: Benchmarks
  description: Load tests with target SLOs, concurrency sweeps and auto-tune
- name: Metering
  description: Usage per API key / model / node / deployment
- name: Billing
  description: Cost reports from usage × price plans
- name: PKI
  description: 'Internal CA: CA certificate, service certificates, CRL'
- name: Health
  description: Liveness/readiness and system info
- name: Branding
  description: White-label values from .env (public, read-only)
- name: Live
  description: Server-sent events and WebSocket for live dashboards
- name: GPU Instances
  description: 'SSH GPU instances on demand: a container with sshd and whole GPUs or a GPU slice, started by the node agent; TTL / idle auto-stop, billed as GPU minutes'
- name: Agent Downloads
  description: Node-agent builds and the install script used by the join flow (join token or admin session)
- name: Cloud
  description: 'Cloud GPU VMs on AWS, Azure, GCP and DigitalOcean: catalog, provisioning, lifecycle'
