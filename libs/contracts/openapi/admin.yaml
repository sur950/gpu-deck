          type:
          - string
          - 'null'
          format: date-time
          description: Set when the token is used up (use_count reached max_uses)
        used_by_node_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Node created by the most recent join
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
