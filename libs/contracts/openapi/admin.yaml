          type:
          - string
          - 'null'
          format: uuid
          description: Take an existing standalone slice (POST /devices/{id}/slices)
        device_vendor:
          type:
          - string
          - 'null'
          enum:
          - nvidia
          - amd
          - hygon
          - metax
          - moorethreads
          - thead
          - apple
          - null
        node_selector:
          type: object
          default: {}
          description: Node labels plus node_ids / device_ids pinning
        authorized_keys:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
          description: OpenSSH public key lines (no options prefix)
        ssh_user:
          type: string
          default: gpudeck
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        container_port:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 65535
        ssh_port:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 65535
          description: 'Requested host port (default: agent picks from 2200-2299)'
        allowed_source_cidrs:
          type: array
          items:
            type: string
          default: []
        limits:
          $ref: '#/components/schemas/GpuInstanceLimits'
        env:
          type: object
          additionalProperties:
            type: string
          default: {}
        volumes:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/GpuInstanceVolume'
          default: []
        labels:
          type: object
          additionalProperties:
            type: string
          default: {}
        ttl_seconds:
          type:
          - integer
          - 'null'
          minimum: 60
          description: Auto-stop after this long (default GPU_INSTANCE_DEFAULT_TTL_SECONDS)
        idle_timeout_seconds:
          type:
          - integer
          - 'null'
          minimum: 60
          description: Auto-stop after this long without an SSH connection
        wait_for_capacity_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: Queue the request (state requested) instead of 409 when nothing fits
