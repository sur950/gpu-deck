# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem and directory; major updates come one by one so they can be reviewed on their own.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: [/apps/fastapi, /apps/cli]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    # pnpm workspace: one lockfile at the root covers apps/web and apps/desktop.
    directories: [/, /apps/web, /apps/desktop]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories: [/apps/node-agent, /apps/desktop/src-tauri]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/terraform-provider
    schedule: { interval: weekly, day: monday }
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/infra/docker/api, /infra/docker/web, /infra/docker/node-agent]
    schedule: { interval: weekly, day: monday }
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images:
        patterns: ["*"]
