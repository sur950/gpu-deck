name: Website

# Builds website/ and deploys it to GitHub Pages (https://sur950.github.io/gpu-deck/).
# The home page, styles and scripts are hand-written in website/. Two parts are generated here
# and never committed (both are git-ignored):
#   - website/assets/screenshots/  the display SVGs copied from docs/screenshots/, plus
#     website/assets/brand/og-image.png copied from assets/brand/social-preview.png
#                                  (both by website/sync-screenshots.sh; no raster is committed)
#   - website/docs/                one page per public Markdown doc, the docs home, the search
#                                  index and the diagram styles (scripts/build_docs.py, which also
#                                  rewrites website/sitemap.xml and website/404.html and fails on
#                                  a broken link, anchor or asset anywhere on the site)
# The diagrams are pre-rendered SVGs in website/assets/diagrams/ (committed; refresh them with
# `python scripts/build_docs.py --render-diagrams` after a ```mermaid block changes).
# Repository setting needed once: Settings, Pages, Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build_docs.py"
      - "scripts/requirements-docs.txt"
      - "**/*.md"
      - "docs/screenshots/**"
      - "assets/brand/social-preview.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits, an ongoing deploy is never cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so each doc page and the sitemap carry the date of the last change.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt

      - name: Install the site tools (pinned)
        run: |
          python -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --quiet --requirement scripts/requirements-docs.txt
          echo "$RUNNER_TEMP/site-venv/bin" >> "$GITHUB_PATH"

      - name: Screenshots (display SVGs from docs/screenshots)
        run: website/sync-screenshots.sh

      - name: Documentation pages, search index, sitemap and site check
        run: python scripts/build_docs.py

      - name: Publish only the site
        run: |
          [[ -f website/index.html && -f website/docs/index.html ]] || { echo "::error::the build is incomplete"; exit 1; }
          touch website/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
