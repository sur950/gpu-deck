{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Throwaway installs only: real deployments reference secrets.existingSecret (managed by an
# external secret store) so no secret value ever lands in Helm values or release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpudeck.secretName" . }}
  labels:
    {{- include "gpudeck.labels" . | nindent 4 }}
  annotations:
    # Must exist before the pre-install migration hook runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
