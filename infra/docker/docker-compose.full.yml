# Self-contained stack: adds its own Postgres 17 and Redis containers (instead of the dev
# dependency containers from docker-compose.deps.yml) and, with --profile observability,
# Prometheus, Grafana and an OpenTelemetry collector. Layer it on top of docker-compose.yml:
#
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.full.yml up -d
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.full.yml \
#     --profile observability up -d
#
# Database credentials: POSTGRES_PASSWORD (required) and REDIS_PASSWORD (required) in the shell
# or a compose .env file next to this file. Migrations: `... run --rm migrate`.

x-full-env: &full-env
  APP_ENV: ${APP_ENV:-production}
  PKI_CA_DIR: /app/certs
  LOG_FILE_PATH: /app/logs/app.log
  TMPDIR: /tmp
  DATABASE_URL: postgresql://gpudeck:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/gpu_deck
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: gpudeck
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: gpu_deck
  REDIS_URL: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_USERNAME: default
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-depends-data: &depends-data
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: gpudeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gpu_deck
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=300"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpudeck -d gpu_deck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    read_only: true
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped

  migrate:
    environment: *full-env
    depends_on: *depends-data
  admin-api:
    environment: *full-env
    depends_on: *depends-data
  api-layer:
    environment: *full-env
    depends_on: *depends-data
  agent-hub:
    environment:
      <<: *full-env
      AGENT_HUB_HOST: 0.0.0.0
      AGENT_HUB_PORT: "8443"
    depends_on: *depends-data
  worker:
    environment: *full-env
    depends_on: *depends-data
  beat:
    environment: *full-env
    depends_on: *depends-data
  scheduler:
    environment: *full-env
    depends_on: *depends-data

  # ----- observability profile ------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  # docker-compose.yml joins the external dev-deps network; this stack does not need it.
  deps:
    name: gpu-deck-full-deps
    external: false

volumes:
  postgres-data: {}
  redis-data: {}
  prometheus-data: {}
  grafana-data: {}
