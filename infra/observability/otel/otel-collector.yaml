# OpenTelemetry collector: receives OTLP from admin-api, api-layer, agent-hub and jobs
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317), batches, drops secrets from span
# attributes, and exports traces to an OTLP backend (Tempo/Jaeger) plus metrics to Prometheus.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 5s
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.x-api-key
        action: delete
      - key: http.request.header.x-csrf-token
        action: delete
      - key: db.statement
        action: hash
  resource:
    attributes:
      - key: service.namespace
        value: gpu-deck
        action: upsert

exporters:
  # Traces go to the debug log by default. To keep them, add a backend and use it in the
  # traces pipeline, e.g.
  #   otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
